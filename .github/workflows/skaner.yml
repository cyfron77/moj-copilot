name: Auto Skaner Quant Model

on:
  schedule:
    # Skanowanie o 9:30 UTC (11:30 czasu polskiego) od poniedziałku do piątku
    - cron: '30 7 * * 1-5'
    # Skanowanie o 16:00 UTC (18:00 czasu polskiego) od poniedziałku do piątku
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Pozwala na ręczne uruchomienie przyciskiem w zakładce Actions

jobs:
  skanuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu aplikacji
        uses: actions/checkout@v4

      - name: Konfiguracja języka Python (wersja 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja wymaganych bibliotek
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Uruchomienie bota analizującego rynek
        env:
          # Bezpieczne wstrzyknięcie kluczy przechowywanych w GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_skaner.py
